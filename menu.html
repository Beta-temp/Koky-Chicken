};
const originalSetLang=Koky.setLang;
function setMenuLang(l){
 Koky.setLang(l);
 const d=MENU_I18N[l]||MENU_I18N.ar;
 document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(d[k])el.innerHTML=d[k]});
 document.title=d.menu_page_title;
 const b=document.getElementById('langBtn');if(b)b.textContent=l==='ar'?'EN':'عربي';
 try{localStorage.setItem('koky_lang',l)}catch(e){}
 document.dispatchEvent(new Event('langchange'));
}
document.getElementById('langBtn').addEventListener('click',()=>setMenuLang(Koky.lang()==='ar'?'en':'ar'));
setMenuLang(Koky.lang());
document.getElementById('year').textContent=new Date().getFullYear();
</script>
